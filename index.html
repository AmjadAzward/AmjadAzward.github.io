<body>
    <script>
        // Unpack the ?redirect=... path that public/404.html packed in, restoring
        // the real URL before React Router mounts (see public/404.html for why).
        (function () {
            var params = new URLSearchParams(window.location.search);
            var redirect = params.get("redirect");
            if (redirect) {
                window.history.replaceState(null, "", redirect);
            }
        })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
